<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>O Gabinete do Escrivão — protótipo</title>
<style>
  :root { --tinta:#2a1f14; --papel:#f1e4c6; --papel2:#e4d3ad; --ouro:#d9a441; --laranja:#f08a24; --sombra:#1b1420; --verde:#3f8f5a; --vermelho:#b5432f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#120d16; color:var(--papel); font-family: Georgia, 'Times New Roman', serif; overflow:hidden; touch-action:none; }
  #stage { position:fixed; inset:0; }
  #c { width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .lbl { position:absolute; transform:translate(-50%,-100%); font:600 11px/1.1 system-ui,sans-serif; color:#fff8e6; background:rgba(27,20,32,.72); padding:3px 6px; border-radius:4px; white-space:nowrap; border:1px solid rgba(217,164,65,.5); }
  .lbl.glow { background:var(--laranja); color:#1b1420; border-color:#fff; animation:pulso 1s infinite; }
  @keyframes pulso { 50% { transform:translate(-50%,-100%) scale(1.15); } }
  #hud { position:fixed; left:0; right:0; top:0; padding:10px 12px; padding-top:max(10px, env(safe-area-inset-top)); display:flex; gap:10px; align-items:flex-start; pointer-events:none; }
  #obj { flex:1; background:rgba(27,20,32,.82); border:1px solid rgba(217,164,65,.55); border-radius:10px; padding:8px 11px; font-size:14px; line-height:1.3; }
  #obj b { color:var(--ouro); font:700 11px system-ui,sans-serif; letter-spacing:.08em; text-transform:uppercase; display:block; margin-bottom:2px; }
  #btnCad { pointer-events:auto; background:var(--papel); color:var(--tinta); border:2px solid var(--ouro); border-radius:10px; font:700 13px system-ui,sans-serif; padding:10px 12px; }
  #btnCad.chama { animation:chama .8s infinite; }
  @keyframes chama { 50% { background:var(--laranja); } }
  #toast { position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translateX(-50%); max-width:88%; background:rgba(27,20,32,.92); border:1px solid var(--ouro); color:var(--papel); padding:10px 14px; border-radius:10px; font-size:14px; line-height:1.35; text-align:center; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.on { opacity:1; }
  #veu { position:fixed; inset:0; background:rgba(10,7,14,.72); display:none; align-items:flex-end; justify-content:center; }
  #veu.on { display:flex; }
  #painel { width:100%; max-width:520px; max-height:88%; overflow:auto; background:var(--papel); color:var(--tinta); border-radius:16px 16px 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom)); border-top:4px solid var(--ouro); touch-action:pan-y; }
  #painel h2 { margin:0 0 6px; font-size:19px; }
  #painel p { margin:6px 0; font-size:15px; line-height:1.4; }
  #painel .nota { font:13px/1.35 system-ui,sans-serif; color:#5b4a35; }
  .bt { display:block; width:100%; margin:8px 0 0; padding:13px 12px; font:700 15px system-ui,sans-serif; color:var(--tinta); background:var(--papel2); border:2px solid var(--tinta); border-radius:10px; text-align:left; }
  .bt.pri { background:var(--ouro); }
  .bt.fecha { background:transparent; border-color:#8a7557; color:#5b4a35; text-align:center; font-weight:600; }
  .bt:disabled { opacity:.45; }
  .medidor { height:22px; background:#cdb98c; border:2px solid var(--tinta); border-radius:6px; overflow:hidden; margin:8px 0 2px; }
  .medidor i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--laranja),var(--ouro)); transition:width .3s; }
  .lance { font:600 20px/1.5 system-ui,sans-serif; letter-spacing:2px; min-height:30px; }
  .dado { display:inline-block; width:28px; height:28px; line-height:26px; text-align:center; border:2px solid var(--tinta); border-radius:5px; margin:0 3px 3px 0; font:700 15px system-ui,sans-serif; background:#fff8e6; }
  .dado.e { background:#3a2f3f; color:#fff; } .dado.o { background:#e9dcc0; } .dado.m { background:#fffdf5; }
  .hist { display:flex; align-items:flex-end; gap:5px; height:74px; margin:6px 0 2px; }
  .hist div { flex:1; background:var(--tinta); border-radius:3px 3px 0 0; min-height:2px; position:relative; }
  .hist div span { position:absolute; bottom:-18px; left:0; right:0; text-align:center; font:600 12px system-ui,sans-serif; }
  .cartao { border:2px solid var(--tinta); border-radius:10px; padding:9px 10px 12px; margin-top:10px; background:#f7ecd2; }
  .cartao h3 { margin:0 0 2px; font-size:15px; }
  .linha2 { display:flex; gap:8px; } .linha2 .bt { margin-top:22px; text-align:center; font-size:14px; padding:10px 6px; }
  .roda { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; margin:8px 0; font:15px/1.4 system-ui,sans-serif; }
  .roda .n { color:#8a7557; font-weight:700; display:inline-block; width:22px; }
  .bits { font:12px/1.3 ui-monospace,monospace; color:#5b4a35; word-break:break-all; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; margin:10px 0; }
  .chip { padding:9px 11px; border:2px solid var(--tinta); border-radius:999px; background:#fff8e6; font:600 14px system-ui,sans-serif; }
  .chip.usado { opacity:.25; }
  .aviso { background:#f3d6c9; border:2px solid var(--vermelho); border-radius:8px; padding:8px 10px; font:13px/1.35 system-ui,sans-serif; margin-top:10px; }
  .estrelas { font-size:20px; letter-spacing:2px; color:var(--laranja); }
  .cad li { margin:6px 0; font-size:15px; line-height:1.35; }
  .dica { background:#ffe2b8; border-left:5px solid var(--laranja); padding:8px 10px; margin:10px 0; font-size:15px; }
  /* cena do Falsario */
  #cena { position:fixed; inset:0; background:radial-gradient(circle at 50% 30%, #3a2440, #0b0710 70%); display:none; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
  #cena.on { display:flex; }
  #cena .vulto { width:110px; height:150px; background:#07050a; border-radius:55px 55px 12px 12px; position:relative; margin-bottom:18px; box-shadow:0 0 40px #000; }
  #cena .vulto:before, #cena .vulto:after { content:''; position:absolute; top:48px; width:14px; height:6px; background:var(--laranja); border-radius:3px; }
  #cena .vulto:before { left:30px; } #cena .vulto:after { right:30px; }
  #cena h2 { margin:0 0 8px; font-size:21px; color:var(--ouro); }
  #cena .palp { font:14px/1.5 ui-monospace,monospace; color:#cbb; min-height:66px; white-space:pre-line; }
  #cena .cont { font:700 17px system-ui,sans-serif; margin:10px 0; color:#fff; min-height:24px; }
  #cena p { max-width:420px; font-size:16px; line-height:1.45; margin:6px 0; }
  #cena .bt { max-width:320px; text-align:center; margin-top:16px; }
  #olho, #vigia { font:700 12px/1.2 system-ui,sans-serif; border-radius:6px; padding:5px 8px; margin-top:6px; display:table; }
  #vigia { display:block; margin:0 0 10px; font-size:14px; padding:9px 10px; text-align:center; }
  #olho.ok, #vigia.ok { background:#2f5f43; color:#eaf7ee; }
  #olho.alerta, #vigia.alerta { background:#b9801f; color:#1b1420; }
  #olho.perigo, #vigia.perigo { background:#b5432f; color:#fff; animation:chama2 .6s infinite; }
  @keyframes chama2 { 50% { background:#e0563d; } }
  .lbl.perigo { background:#b5432f; border-color:#fff; }
  .oculto { display:none !important; }
  #semgl { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:30px; text-align:center; font-size:17px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="labels"></div></div>
<div id="hud"><div id="obj"><b>Objetivo</b><span id="objTxt"></span><div id="olho" class="ok">Janelas vazias</div></div><button id="btnCad">Caderno</button></div>
<div id="toast"></div>
<div id="veu"><div id="painel"></div></div>
<div id="cena"></div>
<div id="semgl">Este aparelho não conseguiu abrir os gráficos 3D do jogo. Tente outro navegador.</div>
<script src="vendor/three.min.js"></script>
<script src="data/palavras.js"></script>
<script src="game.js"></script>
</body>
</html>
